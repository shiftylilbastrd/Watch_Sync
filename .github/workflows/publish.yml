name: Build and publish image

# Builds the daemon's Docker image and pushes it to GitHub Container Registry
# (ghcr.io) on every push to main, so Athena's container just docker-pulls it
# like the rest of the stack - no local build step, nothing tied to another
# app's image existing.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Hardcoded lowercase - github.repository preserves the repo's actual case
  # (Watch_Sync), but Docker/GHCR tags must be lowercase, so deriving it
  # from github.repository breaks the build.
  IMAGE: ghcr.io/shiftylilbastrd/watch_sync

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
